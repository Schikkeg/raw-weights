<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | RawWeights</title>
  <meta name="description" content="Search all RawWeights articles, guides, and interactive playgrounds.">
  <meta name="author" content="RawWeights">
  <link rel="canonical" href="https://rawweights.com/search/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rawweights.com/search/">
  <meta property="og:title" content="Search | RawWeights">
  <meta property="og:image" content="https://rawweights.com/images/rw-og.png">

  <script>(function(){document.documentElement.setAttribute('data-theme','light');})();</script>

  <link rel="stylesheet" href="../includes/brand.css">
  <link rel="stylesheet" href="../pagefind/pagefind-ui.css">
  <script src="../pagefind/pagefind-ui.js" defer></script>
  <script type="text/javascript" async src="../includes/analytics.js"></script>

  <style>
    /* ── Search page: reuse overlay panel styles, but in-flow (not positioned) ── */
    .rw-search-page {
      min-height: 100vh;
      background: var(--rw-bg, #ffffff);
      display: flex;
      flex-direction: column;
    }
    /* Stretch main so footer always sits at page bottom, even with zero results */
    .rw-search-page > main { flex: 1; }
    /* Pre-allocate results drawer space — input stays put when results appear (no CLS) */
    .rw-search-page-panel.rw-search-panel .pagefind-ui__drawer {
      min-height: 55vh !important;
    }

    .rw-search-page-header {
      border-bottom: 1px solid var(--rw-border, #e2e8f0);
      padding: 2rem 1.5rem 1.5rem;
      text-align: center;
    }
    .rw-search-page-header h1 {
      font-family: var(--rw-font-display, 'Space Grotesk', sans-serif);
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 700;
      color: var(--rw-text, #1a1a2e);
      margin: 0 0 0.3rem;
    }
    .rw-search-page-header h1 span { color: var(--rw-orange, #f97316); }
    .rw-search-page-header p {
      font-size: 0.88rem;
      color: var(--rw-text-subtle, #64748b);
      margin: 0;
    }

    /* Container that mirrors .rw-search-inner on the overlay */
    .rw-search-page-body {
      max-width: 860px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 4rem;
    }

    /* Override overlay-specific positioning while keeping all Pagefind UI styles */
    .rw-search-page-panel.rw-search-panel {
      position: static !important;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      max-height: none !important;
      overflow-y: visible !important;
      box-shadow: none !important;
      border-bottom: none !important;
      animation: none !important;
      background: transparent !important;
    }
    /* On the full page, give result rows a gentle card style */
    .rw-search-page-panel.rw-search-panel .pagefind-ui__result {
      border-radius: 10px !important;
      border: 1px solid var(--rw-border, #e2e8f0) !important;
      border-bottom: 1px solid var(--rw-border, #e2e8f0) !important;
      padding: 1rem 1rem 1rem 0.75rem !important;
      margin-bottom: 0.75rem !important;
    }
    .rw-search-page-panel.rw-search-panel .pagefind-ui__result:hover {
      border-color: var(--rw-orange, #f97316) !important;
      box-shadow: 0 2px 12px rgba(249,115,22,0.08) !important;
    }
    /* Show thumbnails at a larger size on the full page */
    .rw-search-page-panel.rw-search-panel .pagefind-ui__result-thumb {
      width: 104px !important;
      height: 72px !important;
    }

    /* Already on the search page — hide the nav search trigger */
    #rw-search-btn, #rw-mobile-search-btn { display: none !important; }
    /* Input full-width matching result card width */
    .rw-search-page-panel.rw-search-panel .pagefind-ui__form { width: 100% !important; }

    @media (max-width: 640px) {
      .rw-search-page-header { padding: 1.5rem 1rem 1rem; }
      .rw-search-page-body   { padding: 1rem 1rem 3rem; }
    }
  </style>
</head>
<body class="rw-search-page">
  <div id="rw-nav"></div>

  <header class="rw-search-page-header">
    <h1>Search <span>RawWeights</span></h1>
    <p>Articles, guides, and interactive playgrounds</p>
  </header>

  <main class="rw-search-page-body">
    <div id="rw-search-results" class="rw-search-panel rw-search-page-panel"
         role="search" aria-label="Site search">
    </div>
  </main>

  <div id="rw-footer"></div>
  <script src="../includes/rw-nav.js?v=20261030"></script>
  <script src="../includes/rw-footer.js?v=20260612"></script>
  <script>
    (function () {
      var q = new URLSearchParams(window.location.search).get('q') || '';
      var el = document.getElementById('rw-search-results');

      /* PagefindUI is loaded via defer in <head> — run after DOM ready */
      function initPF() {
        if (typeof PagefindUI === 'undefined') { setTimeout(initPF, 50); return; }
        try {
          new PagefindUI({
            element:      '#rw-search-results',
            showImages:   true,
            showFilters:  false,
            resetStyles:  false,
            excerptLength: 20,
            translations: { placeholder: 'Search guides, blogs, playgrounds…' }
          });
          /* Apply same type badge + SVG thumbnail logic as the nav overlay */
          if (window.__rw && window.__rw.watchResults) window.__rw.watchResults(el);
          /* Auto-fill from ?q= param */
          if (q) {
            setTimeout(function () {
              var inp = el.querySelector('.pagefind-ui__search-input');
              if (inp) { inp.value = q; inp.dispatchEvent(new Event('input', { bubbles: true })); }
            }, 100);
          }
        } catch (e) {
          el.innerHTML = '<p style="padding:1rem;color:var(--rw-text-subtle)">Search index not found.</p>';
        }
      }
      initPF();
    })();
  </script>
</body>
</html>
