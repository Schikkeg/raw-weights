<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | RawWeights</title>
  <meta name="description" content="Search all RawWeights articles, guides, and interactive playgrounds.">
  <meta name="author" content="RawWeights">
  <link rel="canonical" href="https://rawweights.com/search/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rawweights.com/search/">
  <meta property="og:title" content="Search | RawWeights">
  <meta property="og:image" content="https://rawweights.com/images/rw-og.png">

  <script>(function(){document.documentElement.setAttribute('data-theme','light');})();</script>

  <link rel="stylesheet" href="../includes/brand.css">
  <script type="text/javascript" async src="../includes/analytics.js"></script>

  <style>
    /* ── Page shell ──────────────────────────────────────────── */
    .rw-sp { min-height: 100vh; display: flex; flex-direction: column; background: var(--rw-bg); }
    .rw-sp-results-section { flex: 1; }

    /* ── Hero ────────────────────────────────────────────────── */
    .rw-sp-hero {
      background: linear-gradient(160deg, #0a0e1a 0%, #160e28 50%, #0a1530 100%);
      padding: 3.75rem 1.5rem 3.25rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .rw-sp-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(249,115,22,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(249,115,22,0.035) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .rw-sp-eyebrow {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.71rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--rw-orange, #f97316);
      margin: 0 0 1.25rem;
    }
    .rw-sp-eyebrow::before,
    .rw-sp-eyebrow::after { content: ''; width: 28px; height: 1px; background: var(--rw-orange, #f97316); opacity: 0.45; }
    .rw-sp-hero h1 {
      position: relative;
      font-family: var(--rw-font-display, 'Space Grotesk', sans-serif);
      font-size: clamp(2.4rem, 5.5vw, 3.6rem);
      font-weight: 700;
      color: #fff;
      margin: 0 0 0.65rem;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .rw-sp-sub {
      position: relative;
      font-size: 1rem;
      color: rgba(255,255,255,0.48);
      margin: 0 0 2.5rem;
    }

    /* ── Hero search input ───────────────────────────────────── */
    .rw-sp-input-wrap {
      position: relative;
      max-width: 680px;
      margin: 0 auto;
    }
    .rw-sp-icon {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      stroke: rgba(255,255,255,0.42);
      pointer-events: none;
    }
    #rw-sp-q {
      width: 100%;
      box-sizing: border-box;
      height: 60px;
      padding: 0 3.25rem 0 3.25rem;
      font-family: var(--rw-font-body, 'Inter', sans-serif);
      font-size: 1.05rem;
      color: #fff;
      background: rgba(255,255,255,0.065);
      border: 1.5px solid rgba(255,255,255,0.13);
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      -webkit-appearance: none;
    }
    #rw-sp-q::placeholder { color: rgba(255,255,255,0.36); }
    #rw-sp-q:focus {
      border-color: var(--rw-orange, #f97316);
      box-shadow: 0 0 0 4px rgba(249,115,22,0.16);
      background: rgba(255,255,255,0.09);
    }
    #rw-sp-clear {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      display: none;
      align-items: center;
      justify-content: center;
      border: none;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      cursor: pointer;
      color: rgba(255,255,255,0.6);
      padding: 0;
      transition: background 0.15s;
    }
    #rw-sp-clear:hover { background: rgba(255,255,255,0.18); color: #fff; }
    #rw-sp-clear.visible { display: flex; }
    .rw-sp-hint {
      position: relative;
      margin-top: 0.9rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.28);
    }
    .rw-sp-hint kbd {
      display: inline-block;
      padding: 1px 5px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.38);
    }

    /* ── Results section ─────────────────────────────────────── */
    .rw-sp-results-section {
      background: var(--rw-bg, #fff);
      min-height: 50vh;
    }
    .rw-sp-results-inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* ── Empty / suggested topics ────────────────────────────── */
    #rw-sp-empty { padding-top: 0.25rem; }
    .rw-sp-empty-label {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--rw-text-subtle, #94a3b8);
      margin: 0 0 0.9rem;
    }
    .rw-sp-cats { display: flex; flex-wrap: wrap; gap: 0.55rem; }
    .rw-sp-cat {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--rw-border, #e2e8f0);
      border-radius: 999px;
      font-family: var(--rw-font-body, 'Inter', sans-serif);
      font-size: 0.83rem;
      font-weight: 500;
      color: var(--rw-text-muted, #475569);
      background: none;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .rw-sp-cat:hover { border-color: var(--rw-orange, #f97316); color: var(--rw-orange, #f97316); background: rgba(249,115,22,0.05); }
    .rw-sp-cat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── Status / count / error ──────────────────────────────── */
    .rw-sp-status {
      font-size: 0.85rem;
      color: var(--rw-text-subtle, #94a3b8);
      padding: 0 0 1.25rem 0.25rem;
      min-height: 1.5rem;
    }
    .rw-sp-status strong { color: var(--rw-text, #0f172a); }
    .rw-sp-no-results { font-size: 0.95rem; color: var(--rw-text-muted); padding: 0.5rem 0 0 0.25rem; }
    .rw-sp-no-results strong { color: var(--rw-text); }

    /* ── Result list ─────────────────────────────────────────── */
    .rw-sp-result-list { list-style: none; padding: 0; margin: 0; }
    .rw-sp-result { margin-bottom: 0.75rem; }
    .rw-sp-result:last-child { margin-bottom: 0; }
    .rw-sp-result a {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
      padding: 1rem 1rem 1rem 0.75rem;
      border-radius: 12px;
      border: 1px solid var(--rw-border, #e2e8f0);
      background: var(--rw-card, #fff);
      text-decoration: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .rw-sp-result a:hover {
      border-color: var(--rw-orange, #f97316);
      box-shadow: 0 2px 16px rgba(249,115,22,0.08);
    }

    /* Thumbnail */
    .rw-sp-thumb {
      flex-shrink: 0;
      width: 104px;
      height: 72px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--rw-border, #e2e8f0);
    }
    .rw-sp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rw-sp-thumb.rw-thumb-default {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
    }
    .rw-thumb-blog       { background: rgba(249,115,22,0.10); }
    .rw-thumb-guide      { background: rgba(59,130,246,0.10); }
    .rw-thumb-playground { background: rgba(139,92,246,0.10); }
    .rw-thumb-usecase    { background: rgba(16,185,129,0.10); }
    .rw-thumb-portfolio  { background: rgba(100,116,139,0.10); }
    .rw-thumb-other      { background: rgba(100,116,139,0.08); }

    /* Result body */
    .rw-sp-result-body { flex: 1; min-width: 0; }
    .rw-result-type {
      display: inline-block;
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
      margin-bottom: 0.35rem;
    }
    .rw-result-type--blog       { background: rgba(249,115,22,0.12); color: #ea580c; }
    .rw-result-type--guide      { background: rgba(59,130,246,0.12); color: #2563eb; }
    .rw-result-type--playground { background: rgba(139,92,246,0.12); color: #7c3aed; }
    .rw-result-type--usecase    { background: rgba(16,185,129,0.12); color: #059669; }
    .rw-result-type--portfolio  { background: rgba(100,116,139,0.10); color: #64748b; }
    .rw-result-type--other      { background: rgba(100,116,139,0.08); color: #94a3b8; }
    .rw-sp-result-title {
      font-family: var(--rw-font-display, 'Space Grotesk', sans-serif);
      font-weight: 700;
      font-size: 1rem;
      color: var(--rw-text, #0f172a);
      margin: 0 0 0.3rem;
      line-height: 1.3;
    }
    .rw-sp-result-excerpt {
      font-size: 0.83rem;
      color: var(--rw-text-muted, #475569);
      line-height: 1.55;
      margin: 0;
    }
    .rw-sp-result-excerpt mark {
      background: rgba(249,115,22,0.16);
      color: var(--rw-orange, #f97316);
      border-radius: 2px;
      padding: 0 2px;
    }

    /* ── Nav search button hidden ────────────────────────────── */
    #rw-search-btn, #rw-mobile-search-btn { display: none !important; }

    @media (max-width: 640px) {
      .rw-sp-hero { padding: 2.5rem 1rem 2.25rem; }
      .rw-sp-results-inner { padding: 1.75rem 1rem 3rem; }
      .rw-sp-thumb { display: none; }
    }
  </style>
</head>
<body class="rw-sp">
  <div id="rw-nav"></div>

  <section class="rw-sp-hero">
    <p class="rw-sp-eyebrow">RawWeights</p>
    <h1>Find anything</h1>
    <p class="rw-sp-sub">140+ articles, guides, and interactive AI playgrounds</p>

    <div class="rw-sp-input-wrap">
      <svg class="rw-sp-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="rw-sp-q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search guides, blogs, playgrounds…" aria-label="Search RawWeights">
      <button id="rw-sp-clear" aria-label="Clear search" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p class="rw-sp-hint">Press <kbd>↵ Enter</kbd> to search &nbsp;·&nbsp; <kbd>Ctrl K</kbd> opens search anywhere</p>
  </section>

  <section class="rw-sp-results-section">
    <div class="rw-sp-results-inner">
      <div id="rw-sp-empty">
        <p class="rw-sp-empty-label">Suggested topics</p>
        <div class="rw-sp-cats">
          <button class="rw-sp-cat" data-q="machine learning"><span class="rw-sp-cat-dot" style="background:#f97316"></span>Machine Learning</button>
          <button class="rw-sp-cat" data-q="RAG retrieval"><span class="rw-sp-cat-dot" style="background:#2563eb"></span>RAG</button>
          <button class="rw-sp-cat" data-q="agents agentic"><span class="rw-sp-cat-dot" style="background:#7c3aed"></span>Agents</button>
          <button class="rw-sp-cat" data-q="fine-tuning"><span class="rw-sp-cat-dot" style="background:#059669"></span>Fine-tuning</button>
          <button class="rw-sp-cat" data-q="MCP model context"><span class="rw-sp-cat-dot" style="background:#64748b"></span>MCP</button>
          <button class="rw-sp-cat" data-q="evaluation benchmark"><span class="rw-sp-cat-dot" style="background:#0891b2"></span>Evaluation</button>
          <button class="rw-sp-cat" data-q="generative AI"><span class="rw-sp-cat-dot" style="background:#be185d"></span>Generative AI</button>
          <button class="rw-sp-cat" data-q="deep learning neural"><span class="rw-sp-cat-dot" style="background:#b45309"></span>Deep Learning</button>
        </div>
      </div>
      <p id="rw-sp-status" class="rw-sp-status" aria-live="polite"></p>
      <ul id="rw-sp-list" class="rw-sp-result-list" role="list" aria-label="Search results"></ul>
    </div>
  </section>

  <div id="rw-footer"></div>
  <script src="../includes/rw-nav.js?v=20261030"></script>
  <script src="../includes/rw-footer.js?v=20261030"></script>
  <script type="module">
    var heroInp  = document.getElementById('rw-sp-q');
    var clearBtn = document.getElementById('rw-sp-clear');
    var emptyEl  = document.getElementById('rw-sp-empty');
    var statusEl = document.getElementById('rw-sp-status');
    var listEl   = document.getElementById('rw-sp-list');
    var timer    = null;
    var pf       = null;

    /* ── SVG icons for default thumbnails ── */
    var ICONS = {
      blog:       '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
      guide:      '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
      playground: '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
      usecase:    '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
      other:      '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'
    };

    function typeFromUrl(url) {
      if (url.indexOf('/blog/')       !== -1) return 'blog';
      if (url.indexOf('/guide/')      !== -1) return 'guide';
      if (url.indexOf('/tools/')      !== -1) return 'playground';
      if (url.indexOf('/usecase/')    !== -1) return 'usecase';
      if (url.indexOf('/portfolio/')  !== -1) return 'portfolio';
      return 'other';
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderResults(data, query) {
      listEl.innerHTML = '';
      if (!data.length) {
        statusEl.innerHTML = 'No results for <strong>"' + esc(query) + '"</strong> — try different keywords.';
        return;
      }
      statusEl.innerHTML = data.length + ' result' + (data.length !== 1 ? 's' : '') + ' for <strong>"' + esc(query) + '"</strong>';
      data.forEach(function (r) {
        var slug  = typeFromUrl(r.url);
        var label = { blog:'Blog', guide:'Guide', playground:'Playground', usecase:'Use Case', portfolio:'Portfolio', other:'' }[slug] || '';
        var badge = label ? '<span class="rw-result-type rw-result-type--' + slug + '">' + label + '</span>' : '';
        var thumb = r.meta && r.meta.image
          ? '<div class="rw-sp-thumb"><img src="' + esc(r.meta.image) + '" alt="" loading="lazy"></div>'
          : '<div class="rw-sp-thumb rw-thumb-default rw-thumb-' + slug + '">' + (ICONS[slug] || ICONS.other) + '</div>';
        var li = document.createElement('li');
        li.className = 'rw-sp-result';
        li.innerHTML = '<a href="' + esc(r.url) + '">' + thumb +
          '<div class="rw-sp-result-body">' + badge +
          '<p class="rw-sp-result-title">' + esc(r.meta && r.meta.title || '') + '</p>' +
          '<p class="rw-sp-result-excerpt">' + (r.excerpt || '') + '</p>' +
          '</div></a>';
        listEl.appendChild(li);
      });
    }

    async function doSearch(query) {
      if (!query.trim()) {
        listEl.innerHTML = '';
        statusEl.textContent = '';
        emptyEl.style.display = '';
        return;
      }
      emptyEl.style.display = 'none';
      statusEl.textContent = 'Searching…';
      if (!pf) { statusEl.textContent = 'Loading search…'; return; }
      try {
        var search = await pf.search(query);
        var data   = await Promise.all(search.results.slice(0, 12).map(function (r) { return r.data(); }));
        renderResults(data, query);
      } catch (e) {
        statusEl.textContent = 'Search unavailable — try reloading the page.';
      }
    }

    function onInput() {
      var val = heroInp.value;
      clearBtn.classList.toggle('visible', val.length > 0);
      clearTimeout(timer);
      timer = setTimeout(function () { doSearch(val); }, 260);
    }

    heroInp.addEventListener('input', onInput);

    clearBtn.addEventListener('click', function () {
      heroInp.value = '';
      heroInp.focus();
      onInput();
    });

    document.querySelectorAll('.rw-sp-cat').forEach(function (btn) {
      btn.addEventListener('click', function () {
        heroInp.value = btn.getAttribute('data-q');
        heroInp.dispatchEvent(new Event('input', { bubbles: true }));
        heroInp.focus();
      });
    });

    /* Expose for WebMCP search_rawweights and nav Ctrl+K handler */
    window.__rw = window.__rw || {};
    window.__rw.fillHeroSearch = function (term) {
      heroInp.value = term;
      heroInp.dispatchEvent(new Event('input', { bubbles: true }));
      heroInp.focus();
    };

    /* Ctrl K focuses this input (nav.js also checks fillHeroSearch) */
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        heroInp.focus();
        heroInp.select();
      }
    });

    /* Load Pagefind raw API */
    try {
      pf = await import('../pagefind/pagefind.js');
      await pf.init();
      var q = new URLSearchParams(window.location.search).get('q') || '';
      if (q) {
        heroInp.value = q;
        clearBtn.classList.add('visible');
        emptyEl.style.display = 'none';
        doSearch(q);
      } else {
        heroInp.focus();
      }
    } catch (e) {
      statusEl.textContent = 'Search index not available. Merge the PR and check GitHub Pages.';
    }
  </script>
</body>
</html>
