<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | RawWeights</title>
  <meta name="description" content="Search all RawWeights articles, guides, and interactive playgrounds.">
  <meta name="author" content="RawWeights">
  <link rel="canonical" href="https://rawweights.com/search/">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rawweights.com/search/">
  <meta property="og:title" content="Search | RawWeights">
  <meta property="og:image" content="https://rawweights.com/images/rw-og.png">

  <script>(function(){document.documentElement.setAttribute('data-theme','light');})();</script>

  <link rel="stylesheet" href="../includes/brand.css">
  <link rel="stylesheet" href="../pagefind/pagefind-ui.css">
  <script src="../pagefind/pagefind-ui.js" defer></script>
  <script type="text/javascript" async src="../includes/analytics.js"></script>

  <style>
    /* ── Page shell ──────────────────────────────────────────── */
    .rw-sp { min-height: 100vh; display: flex; flex-direction: column; background: var(--rw-bg); }
    .rw-sp-results { flex: 1; }

    /* ── Hero ────────────────────────────────────────────────── */
    .rw-sp-hero {
      background: linear-gradient(160deg, #0a0e1a 0%, #160e28 50%, #0a1530 100%);
      padding: 3.75rem 1.5rem 3.25rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .rw-sp-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(249,115,22,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(249,115,22,0.035) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .rw-sp-eyebrow {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.71rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--rw-orange, #f97316);
      margin: 0 0 1.25rem;
    }
    .rw-sp-eyebrow::before,
    .rw-sp-eyebrow::after { content: ''; width: 28px; height: 1px; background: var(--rw-orange, #f97316); opacity: 0.45; }
    .rw-sp-hero h1 {
      position: relative;
      font-family: var(--rw-font-display, 'Space Grotesk', sans-serif);
      font-size: clamp(2.4rem, 5.5vw, 3.6rem);
      font-weight: 700;
      color: #fff;
      margin: 0 0 0.65rem;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .rw-sp-sub {
      position: relative;
      font-size: 1rem;
      color: rgba(255,255,255,0.48);
      margin: 0 0 2.5rem;
    }

    /* ── Hero search input ───────────────────────────────────── */
    .rw-sp-input-wrap {
      position: relative;
      max-width: 680px;
      margin: 0 auto;
    }
    .rw-sp-input-wrap .rw-sp-icon {
      position: absolute;
      left: 1.1rem;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      stroke: rgba(255,255,255,0.42);
      pointer-events: none;
      flex-shrink: 0;
    }
    #rw-sp-q {
      width: 100%;
      box-sizing: border-box;
      height: 60px;
      padding: 0 3.25rem 0 3.25rem;
      font-family: var(--rw-font-body, 'Inter', sans-serif);
      font-size: 1.05rem;
      color: #fff;
      background: rgba(255,255,255,0.065);
      border: 1.5px solid rgba(255,255,255,0.13);
      border-radius: 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      -webkit-appearance: none;
    }
    #rw-sp-q::placeholder { color: rgba(255,255,255,0.36); }
    #rw-sp-q:focus {
      border-color: var(--rw-orange, #f97316);
      box-shadow: 0 0 0 4px rgba(249,115,22,0.16);
      background: rgba(255,255,255,0.09);
    }
    /* search icon colour fix on :focus */
    #rw-sp-q:focus ~ .rw-sp-icon { stroke: rgba(255,255,255,0.6); }
    #rw-sp-clear {
      position: absolute;
      right: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      display: none;
      align-items: center;
      justify-content: center;
      border: none;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      cursor: pointer;
      color: rgba(255,255,255,0.6);
      padding: 0;
      transition: background 0.15s;
    }
    #rw-sp-clear:hover { background: rgba(255,255,255,0.18); color: #fff; }
    #rw-sp-clear.visible { display: flex; }
    .rw-sp-hint {
      position: relative;
      margin-top: 0.9rem;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.28);
    }
    .rw-sp-hint kbd {
      display: inline-block;
      padding: 1px 5px;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.38);
    }

    /* ── Results section ─────────────────────────────────────── */
    .rw-sp-results {
      background: var(--rw-bg, #fff);
      min-height: 50vh;
    }
    .rw-sp-results-inner {
      max-width: 860px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 5rem;
    }

    /* ── Empty / suggested topics ────────────────────────────── */
    #rw-sp-empty { padding-top: 0.5rem; }
    .rw-sp-empty-label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--rw-text-subtle, #94a3b8);
      margin: 0 0 1rem;
    }
    .rw-sp-cats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .rw-sp-cat {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.45rem 0.95rem;
      border: 1px solid var(--rw-border, #e2e8f0);
      border-radius: 999px;
      font-family: var(--rw-font-body, 'Inter', sans-serif);
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--rw-text-muted, #475569);
      background: none;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .rw-sp-cat:hover {
      border-color: var(--rw-orange, #f97316);
      color: var(--rw-orange, #f97316);
      background: rgba(249,115,22,0.05);
    }
    .rw-sp-cat-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

    /* ── Pagefind results area ───────────────────────────────── */
    #rw-sp-pf {
      --pagefind-ui-scale: 1;
      --pagefind-ui-primary: var(--rw-orange, #f97316);
      --pagefind-ui-text: var(--rw-text, #0f172a);
      --pagefind-ui-background: var(--rw-bg, #fff);
      --pagefind-ui-border: var(--rw-border, #e2e8f0);
      --pagefind-ui-border-radius: 10px;
      --pagefind-ui-font: var(--rw-font-body, 'Inter', sans-serif);
    }
    /* Pagefind's own form is hidden — hero input drives it */
    #rw-sp-pf .pagefind-ui__form { display: none !important; }
    #rw-sp-pf .pagefind-ui__results-area { margin-top: 0; }
    #rw-sp-pf .pagefind-ui__results { list-style: none; padding: 0; margin: 0; }
    #rw-sp-pf .pagefind-ui__message {
      padding: 0 0 1.25rem 0.25rem !important;
      font-size: 0.85rem !important;
      color: var(--rw-text-subtle, #94a3b8) !important;
      font-weight: 500 !important;
    }
    #rw-sp-pf .pagefind-ui__result {
      display: flex !important;
      gap: 1rem !important;
      align-items: flex-start !important;
      padding: 1rem 1rem 1rem 0.75rem !important;
      margin-bottom: 0.75rem !important;
      border-radius: 12px !important;
      border: 1px solid var(--rw-border, #e2e8f0) !important;
      background: var(--rw-card, #fff) !important;
      transition: border-color 0.15s, box-shadow 0.15s !important;
    }
    #rw-sp-pf .pagefind-ui__result:last-child { margin-bottom: 0 !important; }
    #rw-sp-pf .pagefind-ui__result:hover {
      border-color: var(--rw-orange, #f97316) !important;
      box-shadow: 0 2px 16px rgba(249,115,22,0.08) !important;
    }
    #rw-sp-pf .pagefind-ui__result-thumb {
      flex-shrink: 0 !important;
      width: 104px !important;
      height: 72px !important;
      border-radius: 8px !important;
      overflow: hidden !important;
      border: 1px solid var(--rw-border, #e2e8f0) !important;
    }
    #rw-sp-pf .pagefind-ui__result-thumb img { width: 100% !important; height: 100% !important; object-fit: cover !important; }
    #rw-sp-pf .rw-thumb-default { display: flex !important; align-items: center !important; justify-content: center !important; border: none !important; }
    #rw-sp-pf .rw-thumb-default svg { width: 32px !important; height: 32px !important; flex-shrink: 0; }
    #rw-sp-pf .rw-thumb-blog       { background-color: rgba(249,115,22,0.10) !important; }
    #rw-sp-pf .rw-thumb-guide      { background-color: rgba(59,130,246,0.10) !important; }
    #rw-sp-pf .rw-thumb-playground { background-color: rgba(139,92,246,0.10) !important; }
    #rw-sp-pf .rw-thumb-usecase    { background-color: rgba(16,185,129,0.10) !important; }
    #rw-sp-pf .rw-thumb-portfolio  { background-color: rgba(100,116,139,0.10) !important; }
    #rw-sp-pf .rw-thumb-other      { background-color: rgba(100,116,139,0.08) !important; }
    #rw-sp-pf .pagefind-ui__result-inner { flex: 1; min-width: 0; }
    #rw-sp-pf .pagefind-ui__result-title {
      font-family: var(--rw-font-display, 'Space Grotesk', sans-serif) !important;
      font-weight: 700 !important;
      font-size: 1rem !important;
      margin: 0 0 0.3rem !important;
      line-height: 1.3 !important;
    }
    #rw-sp-pf .pagefind-ui__result-title a { color: var(--rw-text, #0f172a) !important; text-decoration: none !important; }
    #rw-sp-pf .pagefind-ui__result-title a:hover { color: var(--rw-orange, #f97316) !important; }
    #rw-sp-pf .pagefind-ui__result-excerpt {
      font-size: 0.83rem !important;
      color: var(--rw-text-muted, #475569) !important;
      line-height: 1.55 !important;
      margin: 0 !important;
    }
    #rw-sp-pf .pagefind-ui__result-excerpt mark {
      background: rgba(249,115,22,0.16) !important;
      color: var(--rw-orange, #f97316) !important;
      border-radius: 2px;
      padding: 0 2px;
    }
    #rw-sp-pf .rw-result-type {
      display: inline-block;
      font-size: 0.67rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 999px;
      margin-bottom: 0.35rem;
    }
    #rw-sp-pf .rw-result-type--blog       { background: rgba(249,115,22,0.12); color: #ea580c; }
    #rw-sp-pf .rw-result-type--guide      { background: rgba(59,130,246,0.12); color: #2563eb; }
    #rw-sp-pf .rw-result-type--playground { background: rgba(139,92,246,0.12); color: #7c3aed; }
    #rw-sp-pf .rw-result-type--usecase    { background: rgba(16,185,129,0.12); color: #059669; }
    #rw-sp-pf .rw-result-type--portfolio  { background: rgba(100,116,139,0.10); color: #64748b; }
    #rw-sp-pf .rw-result-type--other      { background: rgba(100,116,139,0.08); color: #94a3b8; }
    #rw-sp-pf .pagefind-ui__button {
      margin-top: 1.5rem !important;
      padding: 0.6rem 1.75rem !important;
      border: 1.5px solid var(--rw-border, #e2e8f0) !important;
      border-radius: 8px !important;
      background: transparent !important;
      color: var(--rw-text, #0f172a) !important;
      font-family: var(--rw-font-body, 'Inter', sans-serif) !important;
      font-size: 0.9rem !important;
      cursor: pointer !important;
      transition: border-color 0.15s, color 0.15s !important;
    }
    #rw-sp-pf .pagefind-ui__button:hover { border-color: var(--rw-orange, #f97316) !important; color: var(--rw-orange, #f97316) !important; }

    /* ── Nav search button hidden — we're already here ────────── */
    #rw-search-btn, #rw-mobile-search-btn { display: none !important; }

    @media (max-width: 640px) {
      .rw-sp-hero { padding: 2.5rem 1rem 2.25rem; }
      .rw-sp-results-inner { padding: 1.75rem 1rem 3rem; }
      #rw-sp-pf .pagefind-ui__result-thumb { display: none !important; }
    }
  </style>
</head>
<body class="rw-sp">
  <div id="rw-nav"></div>

  <section class="rw-sp-hero">
    <p class="rw-sp-eyebrow">RawWeights</p>
    <h1>Find anything</h1>
    <p class="rw-sp-sub">140+ articles, guides, and interactive AI playgrounds</p>

    <div class="rw-sp-input-wrap">
      <svg class="rw-sp-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="rw-sp-q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search guides, blogs, playgrounds…" aria-label="Search RawWeights">
      <button id="rw-sp-clear" aria-label="Clear search" type="button">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p class="rw-sp-hint">Press <kbd>↵ Enter</kbd> to search &nbsp;·&nbsp; <kbd>Ctrl K</kbd> opens search anywhere on the site</p>
  </section>

  <section class="rw-sp-results">
    <div class="rw-sp-results-inner">
      <div id="rw-sp-empty">
        <p class="rw-sp-empty-label">Suggested topics</p>
        <div class="rw-sp-cats">
          <button class="rw-sp-cat" data-q="machine learning"><span class="rw-sp-cat-dot" style="background:#f97316"></span>Machine Learning</button>
          <button class="rw-sp-cat" data-q="RAG retrieval"><span class="rw-sp-cat-dot" style="background:#2563eb"></span>RAG</button>
          <button class="rw-sp-cat" data-q="agents agentic"><span class="rw-sp-cat-dot" style="background:#7c3aed"></span>Agents</button>
          <button class="rw-sp-cat" data-q="fine-tuning"><span class="rw-sp-cat-dot" style="background:#059669"></span>Fine-tuning</button>
          <button class="rw-sp-cat" data-q="MCP model context"><span class="rw-sp-cat-dot" style="background:#64748b"></span>MCP</button>
          <button class="rw-sp-cat" data-q="evaluation benchmark"><span class="rw-sp-cat-dot" style="background:#0891b2"></span>Evaluation</button>
          <button class="rw-sp-cat" data-q="generative AI"><span class="rw-sp-cat-dot" style="background:#be185d"></span>Generative AI</button>
          <button class="rw-sp-cat" data-q="neural network deep learning"><span class="rw-sp-cat-dot" style="background:#b45309"></span>Deep Learning</button>
        </div>
      </div>
      <!-- Pagefind renders results here; its own form is hidden via CSS -->
      <div id="rw-sp-pf" role="region" aria-label="Search results" aria-live="polite"></div>
    </div>
  </section>

  <div id="rw-footer"></div>
  <script src="../includes/rw-nav.js?v=20261030"></script>
  <script src="../includes/rw-footer.js?v=20260612"></script>
  <script>
    (function () {
      var q        = new URLSearchParams(window.location.search).get('q') || '';
      var heroInp  = document.getElementById('rw-sp-q');
      var clearBtn = document.getElementById('rw-sp-clear');
      var emptyEl  = document.getElementById('rw-sp-empty');
      var pfEl     = document.getElementById('rw-sp-pf');
      var pfInp    = null;

      /* Expose hero input API — used by WebMCP search_rawweights and Ctrl+K handler in nav.js */
      window.__rw = window.__rw || {};
      window.__rw.fillHeroSearch = function (term) {
        heroInp.value = term;
        heroInp.dispatchEvent(new Event('input', { bubbles: true }));
        heroInp.focus();
      };

      function onInput() {
        var val = heroInp.value.trim();
        clearBtn.classList.toggle('visible', val.length > 0);
        if (emptyEl) emptyEl.style.display = val ? 'none' : '';
        /* Mirror to hidden Pagefind input */
        if (!pfInp) pfInp = pfEl.querySelector('.pagefind-ui__search-input');
        if (pfInp) {
          pfInp.value = heroInp.value;
          pfInp.dispatchEvent(new Event('input', { bubbles: true }));
        }
      }

      heroInp.addEventListener('input', onInput);

      clearBtn.addEventListener('click', function () {
        heroInp.value = '';
        heroInp.focus();
        onInput();
      });

      document.querySelectorAll('.rw-sp-cat').forEach(function (btn) {
        btn.addEventListener('click', function () {
          heroInp.value = btn.getAttribute('data-q');
          heroInp.focus();
          onInput();
        });
      });

      function initPF() {
        if (typeof PagefindUI === 'undefined') { setTimeout(initPF, 50); return; }
        try {
          new PagefindUI({
            element:       '#rw-sp-pf',
            showImages:    true,
            showFilters:   false,
            resetStyles:   false,
            excerptLength: 20,
            translations:  { placeholder: 'Search…' }
          });
          if (window.__rw && window.__rw.watchResults) window.__rw.watchResults(pfEl);
          if (q) {
            /* Auto-fill from ?q= param */
            setTimeout(function () { window.__rw.fillHeroSearch(q); }, 120);
          } else {
            heroInp.focus();
          }
        } catch (err) {
          pfEl.innerHTML = '<p style="padding:1rem 0;color:var(--rw-text-subtle,#94a3b8);font-size:.9rem">Search index not found.</p>';
        }
      }
      initPF();
    })();
  </script>
</body>
</html>
