  <text x="399" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff9c4">correct / wrong alert</text>
  <text x="399" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff9c4">confetti on solve</text>

