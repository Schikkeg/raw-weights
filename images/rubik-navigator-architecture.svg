  <rect x="24" y="181" width="520" height="118" rx="7" fill="#e65100" stroke="#bf360c" stroke-width="1.5"/>

  <!-- Sub-box: Cube3D -->
  <rect x="34" y="194" width="115" height="94" rx="5" fill="#f57f17" stroke="#e65100" stroke-width="1"/>
  <text x="91" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white">Cube3D</text>
  <text x="91" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff9c4">CSS 3D transform</text>
  <text x="91" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff9c4">drag via @use-gesture</text>
  <text x="91" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff9c4">Framer Motion spring</text>
