  <rect x="474" y="194" width="60" height="94" rx="5" fill="#f57f17" stroke="#e65100" stroke-width="1"/>
  <text x="504" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white">Voice</text>
  <text x="504" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#fff9c4">per-move</text>
  <text x="504" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#fff9c4">narration</text>
  <text x="504" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#fff9c4">stage</text>
  <text x="504" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#fff9c4">announce</text>

