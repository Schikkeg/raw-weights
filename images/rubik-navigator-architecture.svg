  <text x="241" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="bold" fill="white">★ Pinned Plan</text>
  <text x="241" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ffcdd2">lock sequence mid-step</text>
  <text x="241" y="247" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ffcdd2">no re-plan until done</text>
  <text x="241" y="262" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ffcdd2">step-boundary evaluate</text>
  <text x="241" y="277" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ffcdd2">stash for Undo recovery</text>

