       ROW 3: STATE
  ═══════════════════════════════════════════════════ -->
  <text x="24" y="331" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#6a1b9a" letter-spacing="1">STATE  (Zustand + localStorage persist)</text>

