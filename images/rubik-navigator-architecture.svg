  <text x="558" y="175" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#2e7d32" letter-spacing="1">APP SHELL</text>
  <rect x="558" y="181" width="318" height="118" rx="7" fill="#2e7d32" stroke="#1b5e20" stroke-width="1.5"/>
