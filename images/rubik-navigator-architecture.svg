  <rect x="24" y="337" width="530" height="72" rx="7" fill="#6a1b9a" stroke="#4a148c" stroke-width="1.5"/>
  <text x="289" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">CubeStore</text>
  <text x="289" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#e1bee7">stateString (54-char) · history[] · helpMode</text>
  <text x="289" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ce93d8">doMove · undo · scramble · reset · loadState</text>

  <!-- SettingsStore -->
  <rect x="568" y="337" width="308" height="72" rx="7" fill="#6a1b9a" stroke="#4a148c" stroke-width="1.5"/>
  <text x="722" y="358" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">SettingsStore</text>
  <text x="722" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#e1bee7">muted · speechRate · plainLanguage</text>
  <text x="722" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#ce93d8">persisted to localStorage</text>

  <!-- Arrow: state → engine -->
  <line x1="289" y1="409" x2="289" y2="428" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="722" y1="409" x2="722" y2="428" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════
       ROW 4: CORE ENGINE
  ═══════════════════════════════════════════════════ -->
  <text x="24" y="441" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#37474f" letter-spacing="1">CORE ENGINE</text>

  <!-- cube.ts -->
  <rect x="24" y="447" width="530" height="75" rx="7" fill="#37474f" stroke="#263238" stroke-width="1.5"/>
  <text x="289" y="469" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">cube.ts — Cube Engine</text>
  <text x="289" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#cfd8dc">54-char string · 18 moves (U R F D L B ± ′ 2) · permutation tables</text>
  <text x="289" y="506" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#b0bec5">findEdge() · findCorner() · edgeColors() · isSolved() · generateScramble()</text>

  <!-- solver.ts -->
  <rect x="568" y="447" width="308" height="75" rx="7" fill="#37474f" stroke="#263238" stroke-width="1.5"/>
  <text x="722" y="469" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="white">solver.ts — L-by-L Solver</text>
  <text x="722" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#cfd8dc">7 stages · SolveStep[]</text>
  <text x="722" y="506" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#b0bec5">moves · purposes · reason · highlight</text>

  <!-- Arrow: engine → external -->
  <line x1="289" y1="522" x2="289" y2="540" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="722" y1="522" x2="722" y2="540" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ═══════════════════════════════════════════════════
       ROW 5: EXTERNAL
  ═══════════════════════════════════════════════════ -->
  <text x="24" y="553" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#546e7a" letter-spacing="1">EXTERNAL</text>

  <!-- localStorage -->
  <rect x="24" y="559" width="530" height="14" rx="4" fill="#546e7a" stroke="#37474f" stroke-width="1"/>
  <text x="289" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white">localStorage — cube state + settings persist across sessions</text>

  <!-- Web Speech API -->
  <rect x="568" y="559" width="308" height="14" rx="4" fill="#546e7a" stroke="#37474f" stroke-width="1"/>
  <text x="722" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="white">Web Speech API — voice narration</text>

  <!-- ═══ Legend ═══ -->
  <rect x="24" y="536" width="10" height="10" rx="2" fill="#c62828"/>
  <text x="38" y="545" font-family="Arial,sans-serif" font-size="9" fill="#c62828" font-weight="bold">★ Key design: Pinned Plan prevents the mid-formula re-planning loop</text>

