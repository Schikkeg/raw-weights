  <rect x="568" y="232" width="140" height="56" rx="5" fill="#388e3c" stroke="#2e7d32" stroke-width="1"/>
  <text x="638" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white">MiniCube + MoveArrow</text>
  <text x="638" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#c8e6c9">small cube previews</text>
  <text x="638" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#c8e6c9">animated move arrows</text>

  <rect x="718" y="232" width="148" height="56" rx="5" fill="#388e3c" stroke="#2e7d32" stroke-width="1"/>
  <text x="792" y="252" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="white">ErrorBoundary</text>
  <text x="792" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#c8e6c9">per-route reset</text>
  <text x="792" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#c8e6c9">Wouter SPA routing</text>

