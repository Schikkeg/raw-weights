    <marker id="arr-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" fill="#f8f9ff" rx="14"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#1a1a2e">Rubik Navigator — Component Architecture</text>
  <text x="450" y="50" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#6c757d">React · TypeScript · Vite · Zustand · Framer Motion · Web Speech API</text>

  <!-- ═══════════════════════════════════════════════════
       ROW 1: PAGES
  ═══════════════════════════════════════════════════ -->
  <text x="24" y="71" font-family="Arial,sans-serif" font-size="10" font-weight="bold" fill="#1565c0" letter-spacing="1">PAGES</text>

  <!-- /coach -->
  <rect x="24" y="77" width="220" height="68" rx="7" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="134" y="99" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">/ coach</text>
  <text x="134" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bbdefb">Step-by-step guided solving</text>
  <text x="134" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bbdefb">7 stages · voice · manual feedback</text>

  <!-- /learn -->
  <rect x="258" y="77" width="180" height="68" rx="7" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="348" y="99" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">/learn</text>
  <text x="348" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bbdefb">Cube anatomy</text>
  <text x="348" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bbdefb">Centers · Edges · Corners</text>

  <!-- /notation -->
  <rect x="452" y="77" width="180" height="68" rx="7" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="542" y="99" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">/notation</text>
  <text x="542" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bbdefb">Move reference</text>
  <text x="542" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bbdefb">R R' U U' F F' B B' ...</text>

  <!-- /mycube -->
  <rect x="646" y="77" width="230" height="68" rx="7" fill="#1565c0" stroke="#0d47a1" stroke-width="1.5"/>
  <text x="761" y="99" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">/mycube</text>
  <text x="761" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bbdefb">Input your real cube state</text>
  <text x="761" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#bbdefb">loadState → helpMode on</text>

