<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!--
    RawWeights favicon — weight plate × neural network
    Optimized for small sizes: thicker strokes, larger center hub, simplified nodes.
    Used as: <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  -->

  <!-- Dark rounded square background -->
  <rect width="48" height="48" rx="10" fill="#080c18"/>

  <!-- Outer plate ring — thicker for visibility at 16px+ -->
  <circle cx="24" cy="24" r="19" stroke="#f97316" stroke-width="3" fill="none"/>

  <!-- Inner guide ring — subtle -->
  <circle cx="24" cy="24" r="12" stroke="#f97316" stroke-width="0.8" stroke-opacity="0.25" fill="none"/>

  <!-- 6 neural spokes — thick enough to read at 32px -->
  <!-- Top -->
  <line x1="24" y1="24" x2="24"    y2="6.5"  stroke="#f97316" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Top-right -->
  <line x1="24" y1="24" x2="38.7"  y2="15.2" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Bottom-right -->
  <line x1="24" y1="24" x2="38.7"  y2="32.8" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Bottom -->
  <line x1="24" y1="24" x2="24"    y2="41.5" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Bottom-left -->
  <line x1="24" y1="24" x2="9.3"   y2="32.8" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Top-left -->
  <line x1="24" y1="24" x2="9.3"   y2="15.2" stroke="#f97316" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Node dots on ring (grip holes = network nodes) -->
  <circle cx="24"   cy="6.5"  r="2.5" fill="#f97316"/>
  <circle cx="38.7" cy="15.2" r="2.5" fill="#f97316" opacity="0.85"/>
  <circle cx="38.7" cy="32.8" r="2.5" fill="#f97316"/>
  <circle cx="24"   cy="41.5" r="2.5" fill="#f97316" opacity="0.85"/>
  <circle cx="9.3"  cy="32.8" r="2.5" fill="#f97316"/>
  <circle cx="9.3"  cy="15.2" r="2.5" fill="#f97316" opacity="0.85"/>

  <!-- Center hub — large orange disc -->
  <circle cx="24" cy="24" r="5.5" fill="#f97316"/>
  <!-- Center axle hole — white for depth -->
  <circle cx="24" cy="24" r="2.2" fill="#ffffff" opacity="0.9"/>
</svg>
