<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | RawWeights — Applied AI Projects</title>
  <meta name="description" content="Applied AI projects — agentic systems, RAG pipelines, security tools, fine-tuned models, and interactive ML playgrounds built by RawWeights.">
  <meta name="author" content="RawWeights">
  <link rel="canonical" href="https://rawweights.com/portfolio/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rawweights.com/portfolio/">
  <meta property="og:title" content="Portfolio | RawWeights — Applied AI Projects">
  <meta property="og:description" content="Applied AI projects — agentic systems, RAG pipelines, security tools, fine-tuned models, and interactive ML playgrounds.">
  <script>(function(){var t=localStorage.getItem('rw-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);document.documentElement.classList.add('rw-no-transition');setTimeout(function(){document.documentElement.classList.remove('rw-no-transition');},50);})();</script>
  <link rel="stylesheet" href="../includes/brand.css">
  <script type="text/javascript" async src="../includes/analytics.js"></script>
  <style>
    .port-hero {
      background: linear-gradient(135deg, #080c18 0%, #0f172a 60%, #1a0a2e 100%);
      padding: 5rem 1.5rem 3.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .port-hero::before {
      content: '';
      position: absolute; top: -10%; right: 10%;
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(249,115,22,0.15) 0%, transparent 65%);
      pointer-events: none;
    }
    .port-hero::after {
      content: '';
      position: absolute; bottom: -10%; left: 5%;
      width: 360px; height: 360px;
      background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 65%);
      pointer-events: none;
    }
    .port-hero-inner { max-width: 800px; margin: 0 auto; position: relative; }
    .port-hero-label {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: rgba(249,115,22,0.15); border: 1px solid rgba(249,115,22,0.3);
      border-radius: 9999px; padding: 0.3rem 0.9rem;
      font-size: 0.72rem; font-weight: 700; color: #fb923c;
      text-transform: uppercase; letter-spacing: 0.07em;
      font-family: var(--rw-font-display, sans-serif); margin-bottom: 1.25rem;
    }
    .port-hero h1 {
      font-family: var(--rw-font-display, sans-serif);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800; color: #f0f4ff;
      line-height: 1.1; letter-spacing: -0.025em; margin-bottom: 1rem;
    }
    .port-hero h1 span { color: #fb923c; }
    .port-hero p {
      font-size: 1.05rem; color: rgba(240,244,255,0.65);
      max-width: 540px; margin: 0 auto 1.5rem; line-height: 1.7;
    }
    .port-hero-stats {
      display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap;
      margin-top: 0.5rem;
    }
    .port-hero-stat {
      font-family: var(--rw-font-display, sans-serif);
      font-size: 0.8rem; color: rgba(240,244,255,0.5);
    }
    .port-hero-stat strong { color: #fb923c; font-size: 1.1rem; display: block; }

    /* Filter bar */
    .port-filter-bar {
      max-width: 1200px; margin: 0 auto;
      padding: 1.75rem 1.5rem 0;
      display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
    }
    .port-filter-label {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--rw-text-subtle);
      font-family: var(--rw-font-display, sans-serif);
      margin-right: 0.25rem;
    }
    .port-filter-btn {
      font-family: var(--rw-font-display, sans-serif);
      font-size: 0.8rem; font-weight: 600;
      padding: 0.35rem 0.9rem; border-radius: 9999px;
      border: 1.5px solid var(--rw-border);
      background: var(--rw-card); color: var(--rw-text-muted);
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .port-filter-btn:hover { border-color: #f97316; color: #f97316; }
    .port-filter-btn.active {
      background: #f97316; border-color: #f97316;
      color: #fff;
    }
    .port-count {
      margin-left: auto;
      font-size: 0.78rem; color: var(--rw-text-subtle);
      font-family: var(--rw-font-display, sans-serif);
    }

    /* Grid */
    .port-main { max-width: 1200px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }
    .port-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }
    @media (max-width: 1024px) { .port-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px)  { .port-grid { grid-template-columns: 1fr; } }

    /* Card */
    .port-card {
      background: var(--rw-card, #fff);
      border: 1px solid var(--rw-border, #e2e8f0);
      border-radius: 14px; overflow: hidden;
      display: flex; flex-direction: column;
      text-decoration: none;
      transition: box-shadow 0.18s, border-color 0.18s, transform 0.18s;
    }
    .port-card:hover {
      box-shadow: 0 8px 32px rgba(249,115,22,0.13);
      border-color: #f97316; transform: translateY(-3px);
    }
    .port-card-img { width: 100%; height: 170px; object-fit: cover; display: block; }
    .port-card-placeholder {
      width: 100%; height: 170px;
      display: flex; align-items: center; justify-content: center; font-size: 2.75rem;
    }
    .port-card-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
    .port-card-tags { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.6rem; }
    .port-card-tag {
      font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #f97316;
      font-family: var(--rw-font-display, sans-serif);
    }
    .port-card-tag + .port-card-tag::before { content: '·'; margin-right: 0.35rem; color: var(--rw-text-subtle); }
    .port-card h3 {
      font-family: var(--rw-font-display, sans-serif);
      font-size: 0.97rem; font-weight: 700;
      color: var(--rw-text); line-height: 1.3; margin: 0 0 0.55rem;
    }
    .port-card p {
      font-size: 0.865rem; color: var(--rw-text-muted);
      line-height: 1.6; flex: 1; margin: 0 0 1rem;
    }
    .port-card-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 1rem; }
    .port-chip {
      font-size: 0.67rem; font-weight: 600; padding: 0.18rem 0.5rem;
      border-radius: 9999px; background: var(--rw-bg-alt);
      border: 1px solid var(--rw-border); color: var(--rw-text-muted);
    }
    .port-card-cta {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.82rem; font-weight: 700; color: #f97316;
      font-family: var(--rw-font-display, sans-serif); margin-top: auto;
    }
    .port-card:hover .port-card-cta { color: #ea580c; }

    [data-theme="dark"] .port-card { background: #1e293b; border-color: #334155; }
    [data-theme="dark"] .port-card h3 { color: #f0f4ff; }
    [data-theme="dark"] .port-chip { background: #0f172a; border-color: #334155; color: #94a3b8; }
    [data-theme="dark"] .port-filter-btn { background: #1e293b; border-color: #334155; color: #94a3b8; }

    .port-empty {
      grid-column: 1/-1; text-align: center;
      padding: 3rem 1rem; color: var(--rw-text-subtle);
      font-size: 0.9rem;
    }
  </style>
</head>
<body style="background:var(--rw-bg,#fff); color:var(--rw-text,#0f172a); min-height:100vh;">

<div id="rw-nav"></div>
<script src="../includes/rw-nav.js?v=20261030"></script>

<!-- Hero -->
<div class="port-hero">
  <div class="port-hero-inner">
    <span class="port-hero-label">⚙️ Applied AI</span>
    <h1>Building with <span>Raw Weights</span></h1>
    <p>Production projects at the intersection of AI fundamentals and real-world engineering — from agentic pipelines to interactive learning tools.</p>
    <div class="port-hero-stats">
      <div class="port-hero-stat"><strong id="stat-total">—</strong> Projects</div>
      <div class="port-hero-stat"><strong id="stat-hackathon">—</strong> Hackathon wins</div>
      <div class="port-hero-stat"><strong id="stat-agentic">—</strong> Agentic builds</div>
    </div>
  </div>
</div>

<!-- Filter + Grid -->
<div class="port-filter-bar" id="port-filter-bar">
  <span class="port-filter-label">Filter</span>
  <button class="port-filter-btn active" data-tag="All">All</button>
  <button class="port-filter-btn" data-tag="Agentic AI">Agentic AI</button>
  <button class="port-filter-btn" data-tag="Hackathon">Hackathon</button>
  <button class="port-filter-btn" data-tag="Security">Security</button>
  <button class="port-filter-btn" data-tag="Fine-Tuning">Fine-Tuning</button>
  <button class="port-filter-btn" data-tag="RAG">RAG</button>
  <button class="port-filter-btn" data-tag="Interactive">Interactive</button>
  <span class="port-count" id="port-count"></span>
</div>

<main class="port-main">
  <div class="port-grid" id="port-grid"></div>
</main>

<div id="rw-footer"></div>
<script src="../includes/rw-footer.js?v=20261030"></script>
<script src="../data/portfolio-data.js"></script>
<script>
(function () {
  var ROOT = '../';
  var data = window.PORTFOLIO_DATA || [];
  var activeTag = 'All';

  // Hero stats
  var hackatonCount = data.filter(function(p){ return p.tags.indexOf('Hackathon') > -1; }).length;
  var agentCount    = data.filter(function(p){ return p.tags.indexOf('Agentic AI') > -1; }).length;
  document.getElementById('stat-total').textContent     = data.length;
  document.getElementById('stat-hackathon').textContent = hackatonCount;
  document.getElementById('stat-agentic').textContent   = agentCount;

  function cardHTML(p) {
    var media = p.image
      ? '<img class="port-card-img" src="' + ROOT + p.image.replace(/^\//, '') + '" alt="' + p.title + '" loading="lazy">'
      : '<div class="port-card-placeholder" style="background:' + (p.gradient || '#1e293b') + '">' + p.emoji + '</div>';
    var tagSpans = p.tags.map(function(t){ return '<span class="port-card-tag">' + t + '</span>'; }).join('');
    var href = /^https?:\/\//.test(p.link) ? p.link : ROOT + p.link.replace(/^\//, '');
    return '<a class="port-card" href="' + href + '">'
      + media
      + '<div class="port-card-body">'
      + '<div class="port-card-tags">' + tagSpans + '</div>'
      + '<h3>' + p.title + '</h3>'
      + '<p>' + p.excerpt + '</p>'
      + '<span class="port-card-cta">' + p.cta + '</span>'
      + '</div></a>';
  }

  function render(tag) {
    activeTag = tag;
    var filtered = tag === 'All' ? data : data.filter(function(p){ return p.tags.indexOf(tag) > -1; });
    var grid = document.getElementById('port-grid');
    if (filtered.length === 0) {
      grid.innerHTML = '<div class="port-empty">No projects in this category yet.</div>';
    } else {
      grid.innerHTML = filtered.map(cardHTML).join('');
    }
    document.getElementById('port-count').textContent = filtered.length + ' project' + (filtered.length !== 1 ? 's' : '');
  }

  document.getElementById('port-filter-bar').addEventListener('click', function(e) {
    var btn = e.target.closest('.port-filter-btn');
    if (!btn) return;
    document.querySelectorAll('.port-filter-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');
    render(btn.getAttribute('data-tag'));
  });

  render('All');
})();
</script>
</body>
</html>
